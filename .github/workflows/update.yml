# Rebuilds the site with the latest classes, schedule and erub status, then publishes it.
# Runs four times a day (rabbis post in the morning), on every change to the code, and on demand.
name: Update and publish

on:
  schedule:
    # 6am, 10am, 2pm and 8pm Eastern (UTC times; shifts by an hour in summer)
    - cron: '0 11,15,19 * * *'
    - cron: '0 1 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # to save new headshot copies into the repository
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Read feeds, schedule and erub status
        run: npm run data
        env:
          COMMUNITY_CODE: ${{ secrets.COMMUNITY_CODE }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SHEET_TEACHERS_URL: ${{ secrets.SHEET_TEACHERS_URL }}
          SHEET_SCHEDULE_URL: ${{ secrets.SHEET_SCHEDULE_URL }}
          SHEET_NOTICES_URL: ${{ secrets.SHEET_NOTICES_URL }}
          SHEET_RESOURCES_URL: ${{ secrets.SHEET_RESOURCES_URL }}
          SHEET_OVERRIDES_URL: ${{ secrets.SHEET_OVERRIDES_URL }}
      # Phone-sized copies of the teachers' headshots. Made once from the original, then kept in the repository
      # (content/people), so they no longer depend on the old Virtual Midrash site or its storage.
      - name: Compare with the old site's archive (report only)
        run: node scripts/compare-archive.mjs || true
      - name: Make phone-sized headshots
        run: node scripts/photos.mjs
      - name: Save new headshots
        run: |
          git config user.name "Virtual Midrash bot"
          git config user.email "noreply@github.com"
          git add content/people
          if git diff --cached --quiet; then echo "No new headshots."; exit 0; fi
          git commit -q -m "Headshots: $(git diff --cached --name-only | wc -l) files"
          git pull -q --rebase || true
          git push -q || echo "Could not save headshots this time; the next update will try again."
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
