name: Headshots
# Run by hand (Actions → Headshots → Run workflow) after adding teachers with new photos.
# Collects the original photos so they can be restyled: cut out onto white, face centred.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/headshot-sources.mjs
      # The originals go on their own branch (not main), where the restyling step picks them up.
      - run: |
          cd headshot-src
          git init -q -b headshot-src
          git add -A
          git -c user.name="virtual-midrash-bot" -c user.email="bot@users.noreply.github.com" commit -q -m "Original headshots"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" headshot-src
